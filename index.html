<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Igreja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#EEF0F5;--surface:#FFFFFF;--surface2:#F6F7FA;--ink:#1A1E31;--muted:#5B6176;--line:#DADDE7;
  --brand:#2A3889;--brand-ink:#FFFFFF;--danger:#B43A3A;--warn:#B9740F;--ok:#1E8656;
  --m1:#2A3889;--m2:#16807A;--m3:#9A4A12;--m4:#6A3FCF;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131B;--surface:#1A1D28;--surface2:#222634;--ink:#E8EAF2;--muted:#9AA0B5;--line:#2E3243;
  --brand:#8E9DF2;--brand-ink:#11131B;--danger:#EE7B7B;--warn:#E8A747;--ok:#4CC48D;
  --m1:#8E9DF2;--m2:#4CC7BE;--m3:#EBA06A;--m4:#B39CF6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11131B;--surface:#1A1D28;--surface2:#222634;--ink:#E8EAF2;--muted:#9AA0B5;--line:#2E3243;--brand:#8E9DF2;--brand-ink:#11131B;--danger:#EE7B7B;--warn:#E8A747;--ok:#4CC48D;--m1:#8E9DF2;--m2:#4CC7BE;--m3:#EBA06A;--m4:#B39CF6;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}

.demo-x{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:18px}
.demo select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.igreja{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.top h1{font-size:1.9rem}
.sub{color:var(--muted);margin:2px 0 0}
.usr{font-size:.85rem;color:var(--muted);text-align:right}
.usr a{color:var(--brand)}
.papel{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink)}

.hoje{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:22px}
.hoje h2{font-size:1.1rem;margin-bottom:10px}
.hoje ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hoje li{display:flex;align-items:center;gap:10px;font-size:.95rem}
.hoje li a{margin-left:auto;font-weight:600;color:var(--brand);text-decoration:none;white-space:nowrap}
.pill{width:10px;height:10px;border-radius:50%;flex:none}
.p-danger{background:var(--danger)} .p-warn{background:var(--warn)} .p-ok{background:var(--ok)}

.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mod{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.mod::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.mod:hover,.mod:focus-visible{transform:translateY(-2px);box-shadow:0 10px 26px -14px color-mix(in srgb,var(--c) 70%,transparent);border-color:color-mix(in srgb,var(--c) 45%,var(--line));outline:none}
.mod-h{display:flex;gap:14px;align-items:center}
.ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.mod h3{font-size:1.3rem}
.mod p{margin:0;color:var(--muted);font-size:.93rem}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.n{background:var(--surface2);border-radius:12px;padding:10px}
.n b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.45rem;line-height:1.1}
.n span{font-size:.76rem;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.n.alerta b{color:var(--danger)}
.prox{font-size:.88rem;border-top:1px dashed var(--line);padding-top:12px;display:flex;gap:8px;align-items:flex-start}
.prox strong{color:var(--ink)}
.ir{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--c)}
.ir svg{transition:transform .15s}
.mod:hover .ir svg{transform:translateX(4px)}
.breve{border-style:dashed;background:transparent}
.breve::before{display:none}
.breve .ic{background:var(--surface2);color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);align-self:flex-start}
.nota{margin-top:26px;font-size:.85rem;color:var(--muted);text-align:center}
.ac{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.ac-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ac h2{font-size:1.3rem}
.scroll{overflow-x:auto}
.ac table{width:100%;border-collapse:collapse;min-width:640px;font-size:.92rem}
.ac th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.ac th.mc{text-align:center}
.ac th .dotm{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.ac td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ac td.mc{text-align:center}
.ac .pn{font-weight:600}
.ac .pe{font-size:.8rem;color:var(--muted)}
.ac select,.ac input[type=text],.ac input[type=email]{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 9px;width:100%}
.sw{position:relative;display:inline-block;width:46px;height:26px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .15s}
.sw input:checked+span{background:var(--c)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.sw input:disabled+span{opacity:.55}
.rm{border:0;background:none;color:var(--danger);font-weight:600;cursor:pointer;padding:6px}
.add{display:grid;grid-template-columns:2fr 2fr 1.4fr auto;gap:8px;margin-top:14px;align-items:end}
.add label{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.leg{font-size:.82rem;color:var(--muted);margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:700px){.add{grid-template-columns:1fr 1fr}.add .btn{grid-column:1/-1}}
@media (max-width:560px){.top h1{font-size:1.5rem}.usr{text-align:left}.nums{gap:6px}.n b{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.notice{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));padding:10px 14px;border-radius:12px;font-size:.92rem;margin:0}
.lnk{background:none;border:0;padding:0;color:var(--brand);font:inherit;cursor:pointer;text-decoration:underline}
.hint{font-weight:500;font-size:.85rem;color:var(--muted);font-family:Figtree,sans-serif}
.btn.danger-pri{background:var(--danger);border-color:var(--danger);color:#fff}
.login{max-width:440px;margin:60px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.login .logo{width:60px;height:60px}
.mod h3{font-size:1.25rem}
.carregando{opacity:.6}
dialog{border:0;border-radius:16px;padding:0;width:min(420px,calc(100% - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(10 12 20 / .45)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" hidden></div>
  <div id="conteudo" hidden>
    <header class="top">
      <div class="igreja">
        <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M9 5h6"/><path d="M5 22V12l7-4 7 4v10"/><path d="M10 22v-5h4v5"/></svg></div>
        <div><h1 id="saud">Olá</h1><p class="sub" id="data"></p></div>
      </div>
      <div class="usr" id="usr"></div>
    </header>
    <section class="hoje" aria-labelledby="hojeT"><h2 id="hojeT">Precisa da sua atenção</h2><ul id="alertas"><li>Carregando…</li></ul></section>
    <div class="mods" id="mods"></div>
    <section class="ac" id="acessos" hidden></section>
  </div>
</div>
<dialog id="dlg2"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
const FB_CONFIG={apiKey:"AIzaSyAjK2jhmt10joTSFT6f6t-V23k_fZp1XUI",authDomain:"acompanhamento-membros.firebaseapp.com",projectId:"acompanhamento-membros",storageBucket:"acompanhamento-membros.firebasestorage.app",messagingSenderId:"127677935199",appId:"1:127677935199:web:a519dcefa289b894dfb5ea"};
const DONO="diegovida2@gmail.com";
const DEPS=[["Homens","Homens"],["Mulheres","Mulheres"],["Jovem","Jovens"],["Adolescente","Adolescentes"],["Criança","Crianças"]];
const depNome=v=>(DEPS.find(d=>d[0]===v)||[,v])[1];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>iso(new Date());
const fmtC=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const DIAS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const diaSem=s=>DIAS[new Date(s+"T00:00:00").getDay()];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
function confirmar(msg,ok){return new Promise(res=>{const d=$("#dlg2");d.innerHTML=`<form method="dialog" style="padding:20px;display:grid;gap:16px"><p style="margin:0;font-weight:600">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button value="nao" class="btn">Cancelar</button><button value="sim" class="btn danger-pri">${esc(ok)}</button></div></form>`;d.returnValue="";d.onclose=()=>{d.onclose=null;res(d.returnValue==="sim")};d.showModal()})}
async function gravar(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){console.error(e);toast(e&&e.code==="permission-denied"?"Sem permissão para esta ação.":"Não foi possível salvar. Tente de novo.");return false}}

let db=null,meuEmail="",meuNome="",ac={papel:"",departamento:"",ebd:false,culto:false},souAdmin=false;
let pessoas=[];

const IC={
  membros:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 2 5 4.9"/></svg>',
  ebd:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg>',
  culto:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8 14h3M8 17.5h6"/></svg>'};
const seta='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const MODS={
  membros:{t:"Acompanhamento de Membros",curto:"Acompanhamento",c:"var(--m1)",href:"membros.html",d:"Cadastro, funil por departamento, cuidado, chamada e plano de ação."},
  ebd:{t:"EBD · Escola Bíblica",curto:"EBD",c:"var(--m2)",href:"ebd.html",d:"Escala de professores, preparo das aulas, presença e revistas."},
  culto:{t:"Escala de Culto",curto:"Escala de Culto",c:"var(--m3)",href:"escala-culto.html",d:"Direção, recepção, púlpito, hinos, intercessão e portaria."}};
const stats={};const alertas=[];

function meusModulos(){const m=[];if(souAdmin||(ac.papel==="lider"&&ac.departamento))m.push("membros");if(souAdmin||ac.ebd===true||ac.papel==="ebd")m.push("ebd");if(souAdmin||ac.culto===true||ac.papel==="culto")m.push("culto");return m}
function card(k){const m=MODS[k],s=stats[k];
  return `<a class="mod" href="${m.href}" style="--c:${m.c}"><div class="mod-h"><div class="ic">${IC[k]}</div><h3>${esc(m.t)}${k==="membros"&&!souAdmin?` <span class="hint">· ${esc(depNome(ac.departamento))}</span>`:""}</h3></div><p>${esc(m.d)}</p>
  ${s?`<div class="nums">${s.n.map(([v,l,al])=>`<div class="n ${al?"alerta":""}"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>${s.prox?`<div class="prox">${s.prox}</div>`:""}`:`<div class="nums carregando"><div class="n"><b>…</b><span>carregando</span></div></div>`}
  <div class="ir">Abrir ${seta}</div></a>`}
function render(){
  const mods=meusModulos();
  $("#mods").innerHTML=mods.length?mods.map(card).join(""):`<div class="panel"><p>Seu e-mail ainda não tem nenhum módulo liberado. Peça ao administrador.</p></div>`;
  const al=alertas.slice().sort((a,b)=>(a.t==="danger"?0:1)-(b.t==="danger"?0:1));
  $("#alertas").innerHTML=al.length?al.map(a=>`<li><span class="pill p-${a.t}" aria-hidden="true"></span><span>${a.txt}</span><a href="${MODS[a.k].href}">Ver em ${esc(MODS[a.k].curto)} ›</a></li>`).join(""):`<li><span class="pill p-ok" aria-hidden="true"></span><span>Tudo em dia por aqui.</span></li>`;
  if(souAdmin)renderAcessos();
}

/* ---------- números de cada módulo ---------- */
async function carregarMembros(){
  try{
    const qm=souAdmin?db.collection("membros"):db.collection("membros").where("faixa","==",ac.departamento);
    const qc=souAdmin?db.collection("cuidados"):db.collection("cuidados").where("departamento","==",ac.departamento);
    const [m,c]=await Promise.all([qm.get(),qc.get()]);
    const ms=m.docs.map(x=>x.data()),cs=c.docs.map(x=>x.data());const h=hoje();
    const mem=ms.filter(x=>["lider","participante","cuidado"].includes(x.grupo)).length,con=ms.filter(x=>x.grupo==="conectando").length;
    const pend=cs.filter(x=>x.status&&x.status!=="concluido"),atr=pend.filter(x=>x.prazo&&x.prazo<h).length,venceHoje=pend.filter(x=>x.prazo===h).length;
    stats.membros={n:[[mem,"membros"],[con,"visitantes conectando"],[atr,"cuidados atrasados",atr>0]],prox:venceHoje?`<strong>Hoje:</strong> ${venceHoje} ${venceHoje===1?"contato de cuidado vence":"contatos de cuidado vencem"}`:`<strong>Hoje:</strong> nenhum contato de cuidado vence`};
    if(atr)alertas.push({t:"danger",k:"membros",txt:`${atr} ${atr===1?"cuidado está atrasado":"cuidados estão atrasados"}${souAdmin?"":" em "+esc(depNome(ac.departamento))}`});
    if(souAdmin)atualizarDiretorio(m.docs);
  }catch(e){console.warn(e);stats.membros={n:[["—","não foi possível carregar"]]}}
  render();
}
async function atualizarDiretorio(docs){
  try{const lista=docs.map(y=>{const d=y.data();return {id:y.id,nome:d.nome||"",nascimento:d.nascimento||"",whatsapp:d.whatsapp||""}}).filter(m=>m.nome).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
    const atual=await db.collection("config").doc("diretorio_ebd").get();
    if(!atual.exists||JSON.stringify(atual.data().pessoas||[])!==JSON.stringify(lista))await db.collection("config").doc("diretorio_ebd").set({pessoas:lista,atualizadoEm:new Date().toISOString()})}catch(e){console.warn(e)}
}
function triAtual(d){d=d||new Date();return d.getFullYear()+"-T"+(Math.floor(d.getMonth()/3)+1)}
async function carregarEbd(){
  try{
    const [a,l]=await Promise.all([db.collection("ebd_aulas").get(),db.collection("ebd_alunos").get()]);
    const aulas=a.docs.map(x=>x.data()),nAl=l.size;const h=hoje();
    const prox=aulas.filter(x=>x.data>=h&&x.professor).map(x=>x.data).sort()[0];
    const doDia=prox?aulas.filter(x=>x.data===prox&&x.professor):[];const prontas=doDia.filter(x=>x.preparo&&x.preparo.status==="pronto").length;
    const tri=triAtual(),comPres=aulas.filter(x=>x.tri===tri&&x.presentes);
    const dias=[...new Set(comPres.map(x=>x.data))];const media=dias.length?dias.reduce((s,d)=>s+comPres.filter(x=>x.data===d).reduce((t,x)=>t+x.presentes.length,0),0)/dias.length:0;
    const freq=nAl&&dias.length?Math.round(media/nAl*100)+"%":"—";
    stats.ebd={n:[[doDia.length?`${prontas}/${doDia.length}`:"—","aulas preparadas no próximo domingo",doDia.length>prontas],[nAl,"alunos"],[freq,"frequência no trimestre"]],
      prox:prox?`<strong>${diaSem(prox)} ${fmtC(prox)}:</strong> ${doDia.length-prontas?`${doDia.length-prontas} ${doDia.length-prontas===1?"sala sem preparo":"salas sem preparo"}`:"todas as aulas preparadas"}`:"<strong>Próximo domingo:</strong> nenhuma aula escalada"};
    if(prox&&doDia.length>prontas)alertas.push({t:"warn",k:"ebd",txt:`${doDia.length-prontas} ${doDia.length-prontas===1?"aula":"aulas"} da EBD de ${fmtC(prox)} ainda sem preparo`});
  }catch(e){console.warn(e);stats.ebd={n:[["—","não foi possível carregar"]]}}
  render();
}
const SLOTS={direcao:1,recepcao:2,pulpito:1,palavraOferta:1,palavraOficial:1,hinoHarpa:1,hinoOferta:1,intercessao:2,portao:1,abrirFechar:1};
const faltam=c=>Object.entries(SLOTS).reduce((s,[k,q])=>s+Math.max(0,q-(((c.escalados||{})[k]||[]).filter(Boolean).length)),0);
async function carregarCulto(){
  try{
    const x=await db.collection("cultos").get();const cs=x.docs.map(y=>y.data()).filter(c=>c.data);const h=hoje(),mes=h.slice(0,7);
    const d7=new Date();d7.setDate(d7.getDate()+7);const lim=iso(d7);
    const doMes=cs.filter(c=>c.data.slice(0,7)===mes).length;
    const prox=cs.filter(c=>c.data>=h&&c.data<=lim).sort((a,b)=>a.data.localeCompare(b.data));
    const semNome=prox.reduce((s,c)=>s+faltam(c),0);const p1=prox.find(c=>faltam(c)>0)||prox[0];
    stats.culto={n:[[doMes,"cultos no mês"],[semNome,"funções sem nome nos próximos 7 dias",semNome>0],[prox.length,"cultos nos próximos 7 dias"]],
      prox:p1?`<strong>${diaSem(p1.data)} ${fmtC(p1.data)} · ${esc(p1.nome||"Culto")}:</strong> ${faltam(p1)?faltam(p1)+" "+(faltam(p1)===1?"função sem nome":"funções sem nome"):"escala completa"}`:"<strong>Próximos 7 dias:</strong> nenhum culto criado"};
    prox.filter(c=>faltam(c)>0).forEach(c=>alertas.push({t:"warn",k:"culto",txt:`${esc(c.nome||"Culto")} de ${diaSem(c.data).toLowerCase()} ${fmtC(c.data)} com ${faltam(c)} ${faltam(c)===1?"função":"funções"} sem nome`}));
  }catch(e){console.warn(e);stats.culto={n:[["—","não foi possível carregar"]]}}
  render();
}

/* ---------- acessos (só administrador) ---------- */
async function carregarPessoas(){try{const x=await db.collection("acessos").get();pessoas=x.docs.map(y=>({id:y.id,...y.data()})).filter(p=>p.id!==DONO).sort((a,b)=>(a.nome||a.id).localeCompare(b.nome||b.id,"pt-BR"));render()}catch(e){console.error(e)}}
const acValor=p=>p.papel==="admin"?"admin":p.papel==="lider"&&p.departamento?"lider:"+p.departamento:"";
function renderAcessos(){
  const box=$("#acessos");box.hidden=false;
  const opt=v=>[["","Sem acesso"],...DEPS.map(d=>["lider:"+d[0],"Líder · "+d[1]]),["admin","Administrador (tudo)"]].map(([k,t])=>`<option value="${k}" ${k===v?"selected":""}>${t}</option>`).join("");
  const sw=(id,campo,on,dis,cor,rot)=>`<label class="sw" style="--c:${cor}"><input type="checkbox" data-id="${esc(id)}" data-campo="${campo}" ${on?"checked":""} ${dis?"disabled":""} aria-label="${esc(rot)}"><span></span></label>`;
  const linha=p=>{const adm=p.papel==="admin";const ebd=p.ebd===true||p.papel==="ebd",cul=p.culto===true||p.papel==="culto";
    return `<tr><td><div class="pn">${esc(p.nome||p.id)}</div><div class="pe">${esc(p.id)}</div></td><td><select data-id="${esc(p.id)}" data-campo="ac" aria-label="Acompanhamento de ${esc(p.nome||p.id)}">${opt(acValor(p))}</select></td><td class="mc">${sw(p.id,"ebd",adm||ebd,adm,"var(--m2)","EBD para "+(p.nome||p.id))}</td><td class="mc">${sw(p.id,"culto",adm||cul,adm,"var(--m3)","Escala de Culto para "+(p.nome||p.id))}</td><td><button class="rm" data-rm="${esc(p.id)}">Remover</button></td></tr>`};
  box.innerHTML=`<div class="ac-h"><div><h2>Acessos aos módulos</h2><p class="sub">Só o administrador vê esta área. Ligue ou desligue cada módulo por pessoa.</p></div></div>
  <div class="scroll"><table><thead><tr><th>Pessoa</th><th><span class="dotm" style="--c:var(--m1)"></span>Acompanhamento</th><th class="mc"><span class="dotm" style="--c:var(--m2)"></span>EBD</th><th class="mc"><span class="dotm" style="--c:var(--m3)"></span>Escala de Culto</th><th></th></tr></thead>
  <tbody><tr><td><div class="pn">${esc(meuNome||"Você")}</div><div class="pe">${esc(DONO)}</div></td><td>Administrador (dono)</td><td class="mc">${sw("x","x",true,true,"var(--m2)","EBD")}</td><td class="mc">${sw("x","x",true,true,"var(--m3)","Escala")}</td><td></td></tr>${pessoas.map(linha).join("")}</tbody></table></div>
  <form class="add" id="fAdd"><label>Nome<input type="text" name="nome" required autocomplete="off"></label><label>E-mail Google<input type="email" name="email" required placeholder="nome@gmail.com" autocomplete="off"></label><label>Acompanhamento<select name="ac">${opt("")}</select></label><button class="btn pri" type="submit">Adicionar pessoa</button></form>
  <p class="leg">Administrador tem todos os módulos. Um líder só vê o departamento dele no Acompanhamento. EBD e Escala de Culto são liberados separadamente.</p>`;
}
function acParaDoc(v){if(v==="admin")return {papel:"admin",departamento:""};if(v.startsWith("lider:"))return {papel:"lider",departamento:v.slice(6)};return {papel:"nenhum",departamento:""}}

document.addEventListener("change",async ev=>{const e=ev.target;if(!e.dataset||!e.dataset.id||e.dataset.id==="x")return;const p=pessoas.find(x=>x.id===e.dataset.id);if(!p)return;
  let up;if(e.dataset.campo==="ac"){up=acParaDoc(e.value);if(p.papel==="ebd"||p.papel==="culto"){up.ebd=p.papel==="ebd"||p.ebd===true;up.culto=p.papel==="culto"||p.culto===true}}else{up={[e.dataset.campo]:e.checked};if(p.papel==="ebd"||p.papel==="culto"){up.papel="nenhum";up.ebd=e.dataset.campo==="ebd"?e.checked:(p.papel==="ebd"||p.ebd===true);up.culto=e.dataset.campo==="culto"?e.checked:(p.papel==="culto"||p.culto===true)}}
  if(await gravar(()=>db.collection("acessos").doc(p.id).update(up),"Acesso atualizado"))Object.assign(p,up);render()});
document.addEventListener("submit",async ev=>{if(ev.target.id!=="fAdd")return;ev.preventDefault();const f=ev.target.elements;const em=f.email.value.trim().toLowerCase();
  if(!/^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(em)){toast("E-mail inválido.");return}if(em===DONO||pessoas.some(p=>p.id===em)){toast("Essa pessoa já está na lista.");return}
  const doc={email:em,nome:f.nome.value.trim(),...acParaDoc(f.ac.value),ebd:false,culto:false,liberadoPor:meuEmail,liberadoEm:new Date().toISOString()};
  if(await gravar(()=>db.collection("acessos").doc(em).set(doc),"Pessoa adicionada. Agora ligue os módulos dela.")){pessoas.push({id:em,...doc});pessoas.sort((a,b)=>(a.nome||a.id).localeCompare(b.nome||b.id,"pt-BR"));render()}});
document.addEventListener("click",async ev=>{const t=ev.target.closest("button,a");if(!t)return;const ds=t.dataset;
  if(ds.act==="entrar"){entrar(false);return}if(ds.act==="trocar-conta"){entrar(true);return}
  if(ds.act==="sair"){firebase.auth().signOut().then(()=>location.reload());return}
  if(ds.rm){const p=pessoas.find(x=>x.id===ds.rm);if(p&&await confirmar(`Remover todos os acessos de ${p.nome||p.id}?`,"Remover")){if(await gravar(()=>db.collection("acessos").doc(p.id).delete(),"Acessos removidos")){pessoas=pessoas.filter(x=>x.id!==p.id);render()}}}});

/* ---------- login ---------- */
function telaLogin(msg,botao,trocar){document.body.classList.add("sem-acesso");$("#conteudo").hidden=true;$("#login").hidden=false;
  $("#login").innerHTML=`<div class="panel login"><div class="logo" aria-hidden="true">${IC.membros}</div><h2>Painel da Igreja</h2><p class="sub">Entre com a sua conta Google autorizada.</p>${msg?`<p class="notice">${esc(msg)}</p>`:""}${botao?`<button class="btn pri" data-act="${trocar?"trocar-conta":"entrar"}">${trocar?"Entrar com outra conta":"Entrar com Google"}</button>`:""}</div>`}
async function entrar(trocar){const auth=firebase.auth(),p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});try{if(trocar)await auth.signOut();await auth.signInWithPopup(p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")await auth.signInWithRedirect(p);else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){console.error(e);telaLogin(e.code==="auth/unauthorized-domain"?"Este endereço não está autorizado no Firebase.":"Não foi possível entrar. Tente de novo.",true)}}}
function init(){
  if(!window.firebase){telaLogin("Não foi possível carregar. Recarregue a página.",false);return}
  firebase.initializeApp(FB_CONFIG);const auth=firebase.auth();auth.getRedirectResult().catch(e=>console.error(e));
  auth.onAuthStateChanged(async u=>{
    if(!u){telaLogin("",true);return}
    meuEmail=(u.email||"").toLowerCase();meuNome=(u.displayName||"").split(" ")[0];db=firebase.firestore();
    if(meuEmail===DONO){ac={papel:"admin"};}else{try{const x=await db.collection("acessos").doc(meuEmail).get();if(x.exists)ac=x.data();else ac=null}catch(e){console.error(e);ac=null}}
    if(!ac){telaLogin(`O e-mail ${meuEmail} ainda não tem acesso. Peça ao administrador para liberar.`,true,true);return}
    souAdmin=ac.papel==="admin";const mods=meusModulos();
    if(!mods.length){telaLogin(`O e-mail ${meuEmail} ainda não tem nenhum módulo liberado. Peça ao administrador.`,true,true);return}
    const fica=new URLSearchParams(location.search).has("painel");
    if(mods.length===1&&!souAdmin&&!fica){location.replace(MODS[mods[0]].href);return}
    document.body.classList.remove("sem-acesso");$("#login").hidden=true;$("#conteudo").hidden=false;
    const h=new Date().getHours();$("#saud").textContent=(h<12?"Bom dia":h<18?"Boa tarde":"Boa noite")+(meuNome?", "+meuNome:"");
    const d=new Date();$("#data").textContent=DIAS[d.getDay()]+", "+d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"});
    $("#usr").innerHTML=`${esc(meuEmail)} · <button class="lnk" data-act="sair">Sair</button><br><span class="papel">${souAdmin?"Administrador":ac.papel==="lider"?"Líder · "+esc(depNome(ac.departamento)):"Acesso aos módulos"}</span>`;
    render();
    if(mods.includes("membros"))carregarMembros();if(mods.includes("ebd"))carregarEbd();if(mods.includes("culto"))carregarCulto();
    if(souAdmin)carregarPessoas();
  });
}
init();
})();
