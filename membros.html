<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento de Membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF0F5;--surface:#FFFFFF;--surface2:#F6F7FA;--ink:#1A1E31;--muted:#5B6176;--line:#DADDE7;
  --brand:#2A3889;--brand-ink:#FFFFFF;
  --part:#1E8656;--cuid:#B9740F;--conn:#2874C6;--danger:#B43A3A;
  --radius:14px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11131B;--surface:#1A1D28;--surface2:#222634;--ink:#E8EAF2;--muted:#9AA0B5;--line:#2E3243;
    --brand:#8E9DF2;--brand-ink:#11131B;--part:#4CC48D;--cuid:#E8A747;--conn:#69AEF2;--danger:#EE7B7B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131B;--surface:#1A1D28;--surface2:#222634;--ink:#E8EAF2;--muted:#9AA0B5;--line:#2E3243;
  --brand:#8E9DF2;--brand-ink:#11131B;--part:#4CC48D;--cuid:#E8A747;--conn:#69AEF2;--danger:#EE7B7B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.top h1{font-size:1.15rem}
#sync{margin:0;font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px}
.tabs a{text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
  .tabs a{flex:1;text-align:center;padding:10px 2px;font-size:.76rem}
}
main{max-width:1080px;margin:0 auto;padding:20px 16px}
.view-title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-title h2{font-size:1.6rem}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}

/* faixa dos 3 grupos */
.groups{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.bar{display:flex;height:14px;background:var(--surface2)}
.bar span{display:block;height:100%;transition:width .4s}
.gcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gcol{padding:16px;border-left:1px solid var(--line);cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left}
.gcol:first-child{border-left:0}
.gcol:hover{background:var(--surface2)}
.gnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:2.6rem;line-height:1}
.gname{font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
.gdesc{color:var(--muted);font-size:.86rem}
.gsplit{font-size:.82rem;color:var(--muted);margin-top:6px}
@media (max-width:560px){.gcols{grid-template-columns:1fr}.gcol{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center}.gcol:first-child{border-top:0}.gnum{grid-row:span 3;font-size:2.2rem;min-width:56px}.gname{margin:0}}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.c-participante{--g:var(--part)} .c-cuidado{--g:var(--cuid)} .c-conectando{--g:var(--conn)} .c-atraso{--g:var(--danger)}
:root{--lid:#6A3FCF;--aus:#7A8094}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lid:#B39CF6;--aus:#A3A9BB}}
:root[data-theme="dark"]{--lid:#B39CF6;--aus:#A3A9BB}
.c-lider{--g:var(--lid)} .c-ausente{--g:var(--aus)}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pl-card{display:grid;gap:2px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:12px;background:var(--surface);cursor:pointer;font-size:.88rem;color:var(--muted)}
.pl-card b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem}
.pl-card .pl-n{font-weight:700;color:var(--ink);font-size:.95rem}
.pl-card.on{background:color-mix(in srgb,var(--fc) 12%,var(--surface));border-color:var(--fc)}
.pl-at b{color:var(--danger)}
.lbl{font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags .tag{display:inline-flex;position:relative;cursor:pointer}
.tag input{position:absolute;opacity:0;width:1px;height:1px}
.tag span{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.88rem;color:var(--ink);background:var(--surface)}
.tag input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.hero .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:3.2rem;line-height:1;color:var(--brand)}
.hero .txt{flex:1;min-width:160px}
.hero .split{display:flex;gap:10px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:8px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:nth-child(-n+2),.tbl td:nth-child(-n+2){text-align:left}
.tbl thead th{border-top:0;color:var(--muted);font-weight:600;font-size:.82rem}
.scroll{overflow-x:auto}
.hbar{display:grid;grid-template-columns:110px 1fr 32px;gap:8px;align-items:center;font-size:.88rem;margin:4px 0}
.hbar i{display:block;height:10px;border-radius:5px;background:var(--brand)}
.hbar b{text-align:right}
.full-span{margin-top:14px}
.funil{max-width:860px;margin:0 auto}
.f-top,.f-bottom{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;flex-wrap:wrap}
.f-top{margin-bottom:18px}.f-bottom{margin-top:18px}
.f-num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:2.6rem;line-height:1;color:var(--brand);min-width:56px}
.f-bottom .btn{margin-left:auto}
.f-rows{display:grid;gap:6px}
.f-row{display:grid;grid-template-columns:minmax(90px,.55fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center}
.f-lid{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-size:.8rem;line-height:1.3;padding-right:10px;gap:1px;min-width:0}
.f-lid span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.f-lid .f-lt{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fc);font-weight:700}
.f-add{border:1px dashed var(--line);background:none;border-radius:8px;padding:4px 8px;font-size:.75rem;color:var(--muted);cursor:pointer}
.f-lidb{all:unset;display:flex;flex-direction:column;align-items:flex-end;gap:1px;max-width:100%;cursor:pointer;border-radius:8px;padding:2px 4px}
.f-lidb:hover,.f-lidb:focus-visible{background:var(--surface2);outline:2px solid var(--fc)}
.f-box .aus b{color:var(--aus)}
.f-cell{display:flex;justify-content:center}
.f-seg{height:74px;border:0;padding:0 4px;cursor:pointer;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--fc) 70%,#fff) 0%,var(--fc) 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:.08em;text-transform:uppercase;font-weight:700;font-size:1.05rem;transition:filter .15s}
.f-seg.f-last{height:104px;padding-bottom:40px}
.f-seg small{font-family:Figtree,sans-serif;font-size:.78rem;letter-spacing:0;text-transform:none;font-weight:600;opacity:.92}
.f-seg:hover,.f-seg:focus-visible{filter:brightness(1.15);outline:none}
.f-info{display:flex;align-items:center;min-width:0}
.f-line{flex:0 0 32px;border-top:2px dotted var(--fc);position:relative;margin-left:-6px}
.f-line::after{content:"";position:absolute;right:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--fc)}
.f-box{display:flex;flex-wrap:wrap;gap:6px;padding-left:10px;min-width:0}
.f-box button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.f-box button b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:1rem;margin-right:2px}
.f-box button:hover{border-color:var(--fc)}
.f-box .vis b{color:var(--conn)}
@media (max-width:600px){.f-row{grid-template-columns:minmax(62px,.6fr) minmax(0,1fr) minmax(0,1fr)}.f-lid{font-size:.66rem;padding-right:4px}.f-seg{font-size:.72rem;letter-spacing:.03em;height:66px}.f-seg small{font-size:.7rem}.f-seg.f-last{height:96px}.f-box{flex-direction:column;align-items:flex-start}.f-box button{padding:3px 9px;font-size:.78rem}.f-line{flex-basis:16px}}
.seg .segr{position:relative;display:inline-flex;cursor:pointer}
.segr input{position:absolute;opacity:0;width:1px;height:1px}
.segr span{padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted)}
.segr input:checked+span{background:var(--surface2);color:var(--ink)}
.segr input:focus-visible+span{outline:3px solid var(--brand);outline-offset:-3px}
.pix{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
#qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
#qr img,#qr canvas{display:block}
.cc{display:block;font-size:.75rem;word-break:break-all;background:var(--surface2);padding:8px;border-radius:8px;margin:4px 0 8px;max-height:84px;overflow:auto}
label.btn{display:inline-flex;align-items:center}
.deps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.dep-h{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.dep .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:3.2rem;line-height:1;color:var(--brand);min-width:56px}
.dep-g{display:grid;gap:6px}
.dep-i{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:pointer;text-align:left}
.dep-i:hover{border-color:var(--g)}
.dep-i b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem;color:var(--g)}
.alerta b{color:var(--danger)}
#dlg2{width:min(420px,calc(100% - 24px))}
.btn.danger-pri{background:var(--danger);border-color:var(--danger);color:#fff}
.dot{background:var(--g)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent);white-space:nowrap}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .m{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;margin:4px 0}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.stat span{font-size:.82rem;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:72px;resize:vertical}
.toolbar select{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .t{font-weight:600}
.row .m{font-size:.85rem;color:var(--muted);grid-column:1}
.row .chip{grid-row:1/3;grid-column:2;align-self:center}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.check{display:flex!important;gap:8px;align-items:flex-start;font-weight:500!important;color:var(--ink)!important}
.check input{width:auto;margin-top:4px}
.hint{font-weight:400;font-size:.8rem;color:var(--muted)}

/* chamada */
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.att button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.att button[aria-pressed="true"]{border-color:var(--part);background:color-mix(in srgb,var(--part) 12%,var(--surface))}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.att button[aria-pressed="true"] .box{background:var(--part);border-color:var(--part)}
.att .t{font-weight:600;display:block;line-height:1.2}
.att .m{font-size:.8rem;color:var(--muted)}
.sticky-save{position:sticky;bottom:76px;margin-top:14px;display:flex;gap:8px;justify-content:flex-end;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
@media (min-width:721px){.sticky-save{bottom:12px}}
.count{margin-right:auto;font-weight:600}

dialog{border:0;border-radius:18px;padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(10 12 20 / .45)}
.dlg-h{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg-h h2{font-size:1.35rem}
.dlg-b{padding:16px 20px 20px;display:grid;gap:16px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:.93rem}
.info span{display:block;color:var(--muted);font-size:.8rem}
.move{display:flex;gap:8px;flex-wrap:wrap}
.move button{display:flex;align-items:center;gap:6px}
.move button[aria-pressed="true"]{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--surface))}
.timeline{list-style:none;margin:0;padding:0;font-size:.9rem}
.timeline li{padding:6px 0 6px 14px;border-left:2px solid var(--line);position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--g,var(--muted))}
.timeline .m{color:var(--muted);font-size:.82rem}
h4{margin:0 0 6px;font-size:.95rem}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
#toast.on{opacity:1}
.notice{background:color-mix(in srgb,var(--cuid) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--cuid) 40%,var(--line));padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:.92rem}
#usr{margin:0;font-size:.78rem;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--brand);font:inherit;cursor:pointer;text-decoration:underline}
.sem-acesso .tabs{display:none}
.login{max-width:460px;margin:48px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.login h2{font-size:1.5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div>
      <h1>Acompanhamento de Membros</h1>
      <p id="sync">Carregando…</p>
      <p id="usr"></p>
    </div>
    <nav class="tabs" aria-label="Seções">
      <a href="#painel">Painel</a>
      <a href="#funil">Funil</a>
      <a href="#pessoas">Pessoas</a>
      <a href="#chamada">Chamada</a>
      <a href="#cuidado">Cuidado</a>
      <a href="#plano">Plano</a>
    </nav>
  </div>
</header>
<main id="app"><div class="panel"><p class="empty">Carregando…</p></div></main>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const GRUPOS={
  lider:{nome:"Líderes",curto:"Líder",desc:"Lideram e cuidam de pessoas"},
  participante:{nome:"Participantes",curto:"Participante",desc:"Participam e servem"},
  cuidado:{nome:"Em cuidado",curto:"Em cuidado",desc:"Membros um pouco distantes"},
  ausente:{nome:"Ausentes",curto:"Ausente",desc:"Membros sem frequência"},
  conectando:{nome:"Conectando",curto:"Conectando",desc:"Visitantes ou voltando"}
};
const ORDEM=["lider","participante","cuidado","ausente","conectando"];
const MEMBRO_G=["lider","participante","cuidado"];
const TIPOS_ENCONTRO=["Culto jovem","Célula","Evento","Outro"];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hoje(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const dt=s=>new Date(s+"T00:00:00");
const dias=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
function fmt(s){if(!s)return "—";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y}
function idade(n){if(!n)return null;const h=dt(hoje()),b=dt(n);let a=h.getFullYear()-b.getFullYear();if(h.getMonth()<b.getMonth()||(h.getMonth()===b.getMonth()&&h.getDate()<b.getDate()))a--;return a}
const DEPS=[{v:"Homens",n:"Homens",c:"#7B3FE4"},{v:"Mulheres",n:"Mulheres",c:"#5A4BD6"},{v:"Jovem",n:"Jovens",c:"#3B6FE0"},{v:"Adolescente",n:"Adolescentes",c:"#2193C4"},{v:"Criança",n:"Crianças",c:"#1FB89C"}];
const DEP_VALS=DEPS.map(d=>d.v);
const CAMPO_DEP={membros:"faixa",cuidados:"departamento",encontros:"departamento",eventos:"departamento",planos:"departamento"};
function depDoMembro(id){const m=membros.find(x=>x.id===id);if(!m)return "";const f=faixa(m);return DEP_VALS.includes(f)?f:""}
const depOpts=sel=>DEPS.map(d=>`<option value="${d.v}" ${sel===d.v?"selected":""}>${d.n}</option>`).join("");
function faixa(m){if(DEP_VALS.includes(m.faixa))return m.faixa;const a=idade(m.nascimento);if(a==null)return "Sem idade";if(a<12)return "Criança";if(a>=12&&a<=17)return "Adolescente";if(a>=18&&a<=29)return "Jovem";return "Outra faixa"}
const ehMenor=m=>{if(m.faixa==="Adolescente"||m.faixa==="Criança")return true;if(m.faixa==="Homens"||m.faixa==="Mulheres"||m.faixa==="Jovem")return false;const a=idade(m.nascimento);return a!=null&&a<18};
const chip=g=>`<span class="chip c-${g}"><span class="dot"></span>${esc(GRUPOS[g]?.curto||g)}</span>`;
const byNome=(a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR");
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2600)}
function setSync(t){$("#sync").textContent=t}
function confirmar(msg,ok,perigo=true,campo=null){
  return new Promise(res=>{const d=$("#dlg2");
    d.innerHTML=`<form method="dialog"><div class="dlg-b" style="padding-top:20px"><p style="margin:0;font-weight:600">${esc(msg)}</p>${campo?`<label style="display:grid;gap:4px;font-size:.88rem;color:var(--muted)">${esc(campo)}<input id="c2in" autocomplete="off"></label>`:""}</div><div class="dlg-f"><button value="nao" class="btn">Cancelar</button><button value="sim" class="btn ${perigo?"danger-pri":"pri"}">${esc(ok||"Confirmar")}</button></div></form>`;
    d.returnValue="";
    d.onclose=()=>{d.onclose=null;const sim=d.returnValue==="sim";res(campo?(sim?(d.querySelector("#c2in")?.value||"").trim():null):sim)};
    d.showModal();
    const inp=d.querySelector("#c2in");if(inp){inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();d.close("sim")}});inp.focus()}
  });
}
const membroPorId=id=>membros.find(m=>m.id===id);
function nomeUsuario(id){if(!id)return "";return nomes[id]||"Alguém da equipe"}

async function gravar(fn,ok){
  if(!podeEditar){toast("Seu acesso é só de leitura.");return false}
  try{await fn();if(ok)toast(ok);return true}
  catch(e){
    if(e&&e.code==="permission-denied"){toast("Sem permissão para gravar. Verifique seu acesso.")}
    else if(e&&e.code==="quota_exceeded")toast("Limite de dados atingido. Exclua registros antigos.");
    else toast("Não foi possível salvar. Tente de novo.");
    console.error(e);return false
  }
}

/* ---------- análise de presença ---------- */
function analise(m){
  const desde=(m.primeiraVisita||(m.criadoEm||"").slice(0,10)||"0000-00-00");
  const ev=encontros.filter(e=>e.data>=desde).sort((a,b)=>b.data.localeCompare(a.data));
  let seguidas=0;for(const e of ev){if((e.presentes||[]).includes(m.id))break;seguidas++}
  const pres=ev.filter(e=>(e.presentes||[]).includes(m.id));
  const h=hoje();
  const p30=pres.filter(e=>dias(e.data,h)<=30).length;
  const p60=pres.filter(e=>dias(e.data,h)<=60).length;
  const c=cuidados.filter(x=>x.membroId===m.id&&x.status==="concluido"&&x.dataAcao).sort((a,b)=>b.dataAcao.localeCompare(a.dataAcao));
  const pend=cuidados.filter(x=>x.membroId===m.id&&x.status!=="concluido").sort((a,b)=>(a.prazo||"9").localeCompare(b.prazo||"9"));
  return {seguidas,p30,p60,ultimaPresenca:pres[0]?.data||null,ultimoContato:c[0]?.dataAcao||null,contatos:c,pendentes:pend,encontrosPossiveis:ev.length,presencas:pres.length};
}
function sugestao(m,a){
  if(m.dispensarAte&&m.dispensarAte>=hoje())return null;
  if(m.grupo==="participante"&&a.seguidas>=3)return {para:"cuidado",motivo:`${a.seguidas} ausências seguidas`};
  if(m.grupo==="conectando"&&a.p60>=4)return {para:"participante",motivo:`${a.p60} presenças nos últimos 60 dias`};
  if(m.grupo==="cuidado"&&a.p30>=3)return {para:"participante",motivo:`Voltou: ${a.p30} presenças em 30 dias`};
  return null;
}

/* ---------- ações ---------- */
async function moverGrupo(m,para,motivo){
  if(m.grupo===para)return;
  const hist=(m.historico||[]).slice();
  hist.push({de:m.grupo,para,data:new Date().toISOString(),motivo:motivo||"",por:meuId||""});
  await gravar(()=>db.collection("membros").doc(m.id).update({grupo:para,historico:hist,dispensarAte:""}),`Movido para ${GRUPOS[para].nome}`);
}

/* ---------- roteamento ---------- */
function route(){
  const h=(location.hash||"").slice(1);
  view=["painel","funil","pessoas","chamada","cuidado","plano"].includes(h)?h:"painel";
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+view)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  render();window.scrollTo(0,0);
}
function render(){
  const app=$("#app");
  if(!db)return;
  const ro=previewDep?`<div class="notice" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px"><b>Visualizando como Líder de ${esc(depInfo(previewDep).n)}.</b> É exatamente o que esse líder vê. O que você alterar aqui é gravado de verdade.</span><button class="btn sm" data-act="sair-preview">Voltar para Administrador</button></div>`:"";
  if(view==="painel")app.innerHTML=ro+vPainel();
  if(view==="funil")app.innerHTML=ro+vFunil();
  if(view==="plano")app.innerHTML=ro+vPlano();
  if(view==="pessoas"){app.innerHTML=ro+vPessoas();lPessoas()}
  if(view==="chamada"){app.innerHTML=ro+vChamada();lChamada()}
  if(view==="cuidado"){app.innerHTML=ro+vCuidado();lCuidado()}
}

  const an=new Map(membros.map(m=>[m.id,analise(m)]));
  const sug=membros.map(m=>({m,s:sugestao(m,an.get(m.id))})).filter(x=>x.s);

  const h=hoje();

  const scHtml=semContato.length?`<ul class="list">${semContato.slice(0,8).map(({m,d})=>`<li><span class="dot c-${m.grupo}"></span><div class="grow"><div class="t">${esc(m.nome)}</div><div class="m">${d==null?"Nenhum contato registrado":`Último contato há ${d} dias`}${m.lider?" · "+esc(m.lider):""}</div></div><button class="btn sm" data-contato="${m.id}">Agendar contato</button></li>`).join("")}</ul>${semContato.length>8?`<p class="empty">E mais ${semContato.length-8} pessoas.</p>`:""}`:`<p class="empty">Todos em cuidado e conectando receberam contato nos últimos ${DIAS_SEM_CONTATO} dias.</p>`;

  const mes=h.slice(0,7),mesN=dt(h).getMonth();
  const aniv=membros.filter(m=>m.nascimento&&dt(m.nascimento).getMonth()===mesN).sort((a,b)=>a.nascimento.slice(8).localeCompare(b.nascimento.slice(8)));

  let novos=0,c2p=0,cu2p=0,p2c=0;

  const ult=encontros.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,8);

  const pendC=cuidados.filter(c=>c.status!=="concluido"),atrasC=pendC.filter(c=>c.prazo&&c.prazo<h);

  const fxMap=new Map(membros.map(m=>[m.id,faixa(m)]));
  const contaF=e=>{const c={t:(e.presentes||[]).length};DEPS.forEach(d=>c[d.v]=0);(e.presentes||[]).forEach(id=>{const f=fxMap.get(id);if(c[f]!=null)c[f]++});return c};

  const med=n=>encMes.length?(n/encMes.length).toFixed(1).replace(".",","):"—";
  const encRows=ult.map(e=>{const c=contaF(e);return `<tr><td>${fmt(e.data)}</td><td>${esc(e.tipo)}${e.titulo?" · "+esc(e.titulo):""}</td>${DVp.map(d=>`<td>${c[d.v]}</td>`).join("")}<td>${c.t}</td></tr>`}).join("");

  return `<div class="view-title"><div><h2>Painel</h2><p class="sub">${tot} pessoas acompanhadas</p></div>${podeEditar?`<button class="btn pri" data-act="novo">Cadastrar pessoa</button>`:""}</div>

    <select id="flider" aria-label="Líder"><option value="">Todos os líderes</option>${lideres.map(l=>`<option ${st.lider===l?"selected":""}>${esc(l)}</option>`).join("")}</select>

function lPessoas(){
  const q=st.busca.trim().toLowerCase();
  const arr=membros.filter(m=>(!st.grupo||m.grupo===st.grupo)&&(!st.faixa||faixa(m)===st.faixa||(st.faixa==="__sem"&&!DEP_VALS.includes(faixa(m))))&&(!st.lider||m.lider===st.lider)&&(!q||[m.nome,m.bairro,m.ministerio,m.lider].join(" ").toLowerCase().includes(q))).sort(byNome);
  const el=$("#lista");if(!el)return;
  if(!arr.length){el.innerHTML=`<div class="panel"><p class="empty">${membros.length?"Ninguém encontrado com esses filtros.":"Nenhuma pessoa cadastrada ainda."}</p></div>`;return}

function opcoesMembros(sel){

function lCuidado(){
  const el=$("#ctList");if(!el)return;

function itemCuidado(c,h){

/* ---------- funil v2 (com líderes) ---------- */
function vFunil(){
  const z=()=>({lider:0,participante:0,cuidado:0,ausente:0,conectando:0});
  const cnt={};DEPS.forEach(d=>cnt[d.v]=z());const tot=z();let sem=0;
  membros.forEach(m=>{if(tot[m.grupo]==null)return;tot[m.grupo]++;const k=cnt[faixa(m)];if(k)k[m.grupo]++;else if(MEMBRO_G.includes(m.grupo))sem++});
  const lids=(cfg.departamentos&&cfg.departamentos.lideres)||{};
  const DV=ehAdmin?DEPS:DEPS.filter(x=>x.v===meuDep);const n=DV.length;
  const rows=DV.map((d,i)=>{const top=100-i*15,bot=i===n-1?0:top-15,ins=((top-bot)/2/top*100).toFixed(2),k=cnt[d.v],ult=i===n-1,mem=k.lider+k.participante+k.cuidado;
    const ls=(lids[d.v]||[]).filter(Boolean).slice(0,4);
    const cb=(g,label,cls,show)=>show?`<button class="${cls}" data-dep="${d.v}" data-dep-grupo="${g}"><b>${k[g]}</b> ${label}</button>`:"";

let importPrev=null;
const COLMAP=[["nome completo","nome"],["cargo","cargo"],["departamento","faixa"],["grupo","grupo"],["voce e","grupo"],["carimbo","carimbo"],["data de nascimento","nascimento"],["nascimento","nascimento"],["cpf","cpf"],["whatsapp","whatsapp"],["telefone do responsavel","responsavelTel"],["nome do responsavel","responsavel"],["autorizacao","consentimento"],["email","email"],["lider","lider"],["serve em","ministerio"],["ministerio","ministerio"],["bairro","bairro"],["como chegou","comoChegou"],["primeira visita","primeiraVisita"],["observacoes","obs"]];
function depDe(s){const n=norm(s);if(!n)return "";if(n.startsWith("homem")||n.startsWith("homens"))return "Homens";if(n.startsWith("mulher"))return "Mulheres";if(n.startsWith("jove"))return "Jovem";if(n.startsWith("adolesc"))return "Adolescente";if(n.startsWith("crian"))return "Criança";return null}
function grupoDe(s){const n=norm(s);if(n.startsWith("lider"))return "lider";if(n.startsWith("ausent"))return "ausente";if(n.startsWith("particip"))return "participante";if(n.includes("cuidado"))return "cuidado";if(n.startsWith("conect")||n.startsWith("visit"))return "conectando";if(n.startsWith("membro"))return "participante";return null}
function dlgImportar(){
  importPrev=null;const d=$("#dlg");d.dataset.id="";d.dataset.ev="";
  d.innerHTML=`<div class="dlg-h"><div><h2>Importar cadastros</h2><div class="sub">Suba vários cadastros de uma vez pela planilha modelo</div></div><button class="btn ghost sm" data-close>Fechar</button></div>

    <div><h4>2. Escolha o arquivo preenchido</h4><label class="btn pri">Escolher planilha<input type="file" id="fImport" accept=".xlsx,.xls,.csv" hidden></label></div>
    <div id="impPrev"></div>
  </div>`;
  d.querySelector("#fImport").addEventListener("change",ev=>lerPlanilha(ev.target.files[0]));
  if(!d.open)d.showModal();
}
async function baixarModelo(){
  try{const r=await fetch("modelo-cadastro-membros.xlsx");if(!r.ok)throw new Error("fetch");const u=new Uint8Array(await r.arrayBuffer());
    await downloads.save({filename:"modelo-cadastro-membros.xlsx",data:new Blob([u],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})})}
  catch(e){if(!e||e.code!=="declined")toast("Não foi possível baixar o modelo.")}
}
async function lerPlanilha(file){
  const box=$("#impPrev");if(!file||!box)return;
  if(!window.XLSX){box.innerHTML=`<p class="empty">Não foi possível carregar o leitor de planilhas. Recarregue a página.</p>`;return}
  box.innerHTML=`<p class="empty">Lendo a planilha…</p>`;
  let rows;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array",codepage:65001});const nm=wb.SheetNames.includes("Cadastros")?"Cadastros":(wb.SheetNames.find(n=>n!=="Instruções"&&n!=="Listas")||wb.SheetNames[0]);rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{raw:false,defval:"",dateNF:"dd/mm/yyyy"})}
  catch(e){box.innerHTML=`<p class="empty">Não foi possível ler o arquivo. Use a planilha modelo em .xlsx.</p>`;return}
  const ok=[],dup=[],err=[];
  rows.forEach((row,ix)=>{
    const linha=ix+2,v={};
    Object.keys(row).forEach(h=>{const n=norm(h);const k=COLMAP.find(([p])=>n.startsWith(p));if(k&&v[k[1]]===undefined)v[k[1]]=String(row[h]??"").trim()});
    const nome=v.nome||"";
    if(!Object.values(v).some(x=>x))return;
    if(norm(nome).startsWith("exemplo"))return;
    const probs=[];
    if(!nome)probs.push("nome vazio");
    const fx=depDe(v.faixa);if(fx===null)probs.push(`departamento “${v.faixa}” inválido`);else if(!fx)probs.push("departamento vazio");if(fx&&!ehAdmin&&fx!==meuDep)probs.push("departamento diferente do seu");
    const gr=grupoDe(v.grupo);if(!gr)probs.push(v.grupo?`grupo “${v.grupo}” inválido`:"grupo vazio");
    const nasc=v.nascimento?dataISO(v.nascimento):"";if(v.nascimento&&!nasc)probs.push("data de nascimento inválida");
    let pv=v.primeiraVisita?dataISO(v.primeiraVisita):"";if(v.primeiraVisita&&!pv)probs.push("primeira visita inválida");if(!pv&&v.carimbo)pv=dataISO(v.carimbo);
    const cpf=soDig(v.cpf);if(cpf&&cpf.length!==11)probs.push("CPF sem 11 números");
    if(probs.length){err.push({linha,nome:nome||"(sem nome)",motivo:probs.join(", ")});return}
    const p={nome,faixa:fx,grupo:gr,nascimento:nasc,cpf,whatsapp:v.whatsapp||"",email:(v.email||"").toLowerCase(),lider:v.lider||"",ministerio:v.ministerio||"",bairro:v.bairro||"",comoChegou:v.comoChegou||"",primeiraVisita:pv,responsavel:v.responsavel||"",responsavelTel:v.responsavelTel||"",consentimento:norm(v.consentimento).startsWith("sim"),obs:v.obs||"",cargo:v.cargo||""};
    if(acharMembro(p)||ok.some(q=>(p.cpf&&q.cpf===p.cpf)||(norm(q.nome)===norm(p.nome)&&q.nascimento===p.nascimento))){dup.push({linha,nome});return}
    ok.push(p)});
  importPrev=ok;
  box.innerHTML=`<div class="stat-row"><div class="stat"><b>${ok.length}</b><span>Prontos para cadastrar</span></div><div class="stat"><b>${dup.length}</b><span>Já cadastrados (ignorados)</span></div><div class="stat ${err.length?"alerta":""}"><b>${err.length}</b><span>Com erro</span></div></div>
  ${err.length?`<h4 style="margin-top:14px">Corrija estas linhas e suba de novo</h4><ul class="list">${err.map(x=>`<li><div class="grow"><div class="t">Linha ${x.linha} · ${esc(x.nome)}</div><div class="m">${esc(x.motivo)}</div></div></li>`).join("")}</ul>`:""}
  ${dup.length?`<details style="margin-top:8px"><summary class="m" style="cursor:pointer">Ver quem já está cadastrado</summary><p class="m">${dup.map(x=>`Linha ${x.linha}: ${esc(x.nome)}`).join("<br>")}</p></details>`:""}
  ${ok.length?`<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn pri" data-act="confirmar-import">Cadastrar ${ok.length} ${ok.length===1?"pessoa":"pessoas"}</button></div>`:`<p class="empty" style="margin-top:10px">Nenhum cadastro novo para importar.</p>`}`;
}
async function confirmarImport(btn){
  if(!importPrev||!importPrev.length)return;
  if(!podeEditar){toast("Seu acesso é só de leitura.");return}
  btn.disabled=true;const tot=importPrev.length,agora=new Date().toISOString();let n=0;
  for(let i=0;i<tot;i+=20){
    const parte=importPrev.slice(i,i+20);
    try{await Promise.all(parte.map(p=>db.collection("membros").doc().set({...p,criadoEm:agora,criadoPor:meuId||"",historico:[{de:null,para:p.grupo,data:agora,motivo:"Importação de planilha",por:meuId||""}]})))}
    catch(e){console.error(e);importPrev=null;btn.textContent="Importação interrompida";toast(`Parou após ${n} de ${tot}. Suba a planilha de novo: quem já entrou será ignorado.`);return}
    n+=parte.length;btn.textContent=`Cadastrando… ${n} de ${tot}`;
  }
  importPrev=null;$("#dlg").close();toast(`${n} ${n===1?"pessoa cadastrada":"pessoas cadastradas"}`);
}

/* ---------- eventos e inscrições ---------- */
const NL=String.fromCharCode(10);
const soDig=s=>String(s||"").replace(/[^0-9]/g,"");
const norm=s=>String(s||"").normalize("NFD").replace(/[^a-zA-Z0-9 ]/g,"").toLowerCase().replace(/ +/g," ").trim();
const mascCPF=c=>{const d=soDig(c);return d.length===11?`***.***.${d.slice(6,9)}-${d.slice(9)}`:esc(c)};
const brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function parseValor(s){s=String(s||"").trim().replace(/[^0-9.,]/g,"");if(s.includes(","))s=s.replace(/[.]/g,"").replace(",",".");const n=Number(s);return isFinite(n)?Math.round(n*100)/100:0}
function dataISO(s){s=String(s||"").trim();let m=s.match(/^([0-9]{1,2})[/]([0-9]{1,2})[/]([0-9]{4})/);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;m=s.match(/^[0-9]{4}-[0-9]{2}-[0-9]{2}/);return m?m[0]:""}

/* PIX copia e cola (BR Code estático) */
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const ascii=s=>String(s||"").normalize("NFD").replace(/[^A-Za-z0-9 .-]/g,"").toUpperCase().trim();
function chavePix(e){let k=String(e.pixChave||"").trim();if(e.pixTipo==="CPF/CNPJ")return soDig(k);if(e.pixTipo==="Celular"){k=soDig(k);if(k.length<=11)k="55"+k;return "+"+k}if(e.pixTipo==="E-mail")return k.toLowerCase();return k}
function pixPayload(e){
  const p=tlv("00","01")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",chavePix(e)))+tlv("52","0000")+tlv("53","986")+(e.valor>0?tlv("54",Number(e.valor).toFixed(2)):"")+tlv("58","BR")+tlv("59",ascii(e.pixNome).slice(0,25)||"RECEBEDOR")+tlv("60",ascii(e.pixCidade).slice(0,15)||"SAO PAULO")+tlv("62",tlv("05","***"))+"6304";
  return p+crc16(p);
}
function convite(e){
  const l=[`*${e.nome}*`,`📅 ${fmt(e.data)}${e.local?" · "+e.local:""}`,e.cobranca==="investimento"?`💰 Investimento: ${brl(e.valor)}`:"✅ Gratuito"];
  if(e.linkInscricao)l.push("",`📝 Faça sua inscrição: ${e.linkInscricao}`);
  if(e.cobranca==="investimento"){if(e.pagModo==="link"&&e.linkPagamento)l.push("",`💳 Pagamento: ${e.linkPagamento}`);else if(e.pixChave)l.push("",`💳 PIX (${e.pixTipo}): ${e.pixChave}`,`Recebedor: ${e.pixNome}`,"","PIX copia e cola:",pixPayload(e))}
  return l.join(NL);
}

function importarCSV(e,file){
  if(!file)return;
  if(!window.Papa){toast("Não foi possível ler o arquivo agora. Recarregue a página.");return}
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:async r=>{
    const hs=r.meta.fields||[];
    const acha=(...ks)=>hs.find(h=>{const n=norm(h);return ks.some(k=>n.includes(k))});
    const cNome=acha("nome completo","nome"),cNasc=acha("nascimento","nasc"),cCpf=acha("cpf"),cTel=acha("whatsapp","telefone","celular","fone"),cEmail=acha("email");
    if(!cNome){toast("Não encontrei a coluna de nome no arquivo.");return}
    const ins=(e.inscritos||[]).slice();let novos=0;
    r.data.forEach(row=>{const nome=String(row[cNome]||"").trim();if(!nome)return;
      const i={nome,nascimento:dataISO(cNasc?row[cNasc]:""),cpf:soDig(cCpf?row[cCpf]:""),whatsapp:String(cTel?row[cTel]||"":"").trim(),email:String(cEmail?row[cEmail]||"":"").trim().toLowerCase(),pago:false};
      if(ins.find(x=>(i.cpf&&x.cpf===i.cpf)||(i.email&&x.email===i.email)||norm(x.nome)===norm(i.nome)))return;
      const m=acharMembro(i);if(m)i.membroId=m.id;ins.push(i);novos++});
    if(!novos){toast("Nenhuma inscrição nova no arquivo.");return}
    await gravar(()=>db.collection("eventos").doc(e.id).update({inscritos:ins}),`${novos} ${novos===1?"inscrição importada":"inscrições importadas"}`);
  },error:()=>toast("Não foi possível ler o arquivo CSV.")});
}
async function cadastrarInscritos(e,idxs){
  if(!podeEditar)return;
  const ins=(e.inscritos||[]).slice();let n=0;
  for(const ix of idxs){const i=ins[ix];if(!i||(i.membroId&&membroPorId(i.membroId)))continue;
    const ex=acharMembro(i);if(ex){ins[ix]={...i,membroId:ex.id};continue}
    const a=idade(i.nascimento),ref=db.collection("membros").doc(),agora=new Date().toISOString();
    const doc={nome:i.nome,nascimento:i.nascimento||"",cpf:i.cpf||"",whatsapp:i.whatsapp||"",email:i.email||"",faixa:e.departamento||(a==null?"":(a<12?"Criança":a<18?"Adolescente":a<=29?"Jovem":"")),grupo:"conectando",primeiraVisita:e.data||hoje(),comoChegou:"Evento",criadoEm:agora,criadoPor:meuId||"",historico:[{de:null,para:"conectando",data:agora,motivo:"Inscrição no evento "+e.nome,por:meuId||""}]};
    if(!await gravar(()=>ref.set(doc)))break;ins[ix]={...i,membroId:ref.id};n++}
  await gravar(()=>db.collection("eventos").doc(e.id).update({inscritos:ins}),n?`${n} ${n===1?"pessoa cadastrada":"pessoas cadastradas"} em Conectando`:"Inscritos vinculados ao cadastro");
}

async function restaurar(file){
  const box=$("#restInfo");if(!file||!box)return;
  let j;try{j=JSON.parse(await file.text())}catch(_){box.innerHTML=`<p class="empty">Arquivo inválido.</p>`;return}
  const col=j.colecoes||j,itens=[];
  COLS.forEach(c=>{const o=col[c];if(o&&typeof o==="object")Object.entries(o).forEach(([id,d])=>{if(d&&typeof d==="object")itens.push([c,id,d])})});
  if(!itens.length){box.innerHTML=`<p class="empty">Nenhum dado encontrado no arquivo.</p>`;return}
  const resumo=COLS.map(c=>[c,itens.filter(i=>i[0]===c).length]).filter(x=>x[1]).map(x=>`${x[0]}: ${x[1]}`).join(", ");
  if(!(await confirmar(`Restaurar ${itens.length} registros (${resumo})?`,"Restaurar",false)))return;
  try{for(let i=0;i<itens.length;i+=400){const b=db.batch();itens.slice(i,i+400).forEach(([c,id,d])=>b.set(db.collection(c).doc(id),d));await b.commit();box.innerHTML=`<p class="empty">Restaurando… ${Math.min(i+400,itens.length)} de ${itens.length}</p>`}
    box.innerHTML=`<p class="empty">Backup restaurado: ${itens.length} registros.</p>`;toast("Backup restaurado")}
  catch(e){console.error(e);box.innerHTML=`<p class="empty">Erro ao restaurar (${esc(e.code||e.message||"")}).</p>`}
}

async function migrarDeps(){
  try{const ops=[];
    membros.forEach(m=>{if(!DEP_VALS.includes(m.faixa)){const f=faixa(m);if(DEP_VALS.includes(f))ops.push([db.collection("membros").doc(m.id),{faixa:f}])}});
    cuidados.forEach(c=>{const d=depDoMembro(c.membroId);if(d&&c.departamento!==d)ops.push([db.collection("cuidados").doc(c.id),{departamento:d}])});
    for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(([r,v])=>b.update(r,v));await b.commit()}
  }catch(e){console.error(e)}
}

async function entrar(trocar){
  const auth=firebase.auth(),p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  try{if(trocar)await auth.signOut();await auth.signInWithPopup(p)}
  catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){await auth.signInWithRedirect(p)}else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){console.error(e);telaLogin(msgErroLogin(e),true)}}
}
